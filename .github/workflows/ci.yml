name: Node.js CI

on:
  push:
    branches:
      - classRoutine_AKILA
  pull_request:
    branches:
      - classRoutine_AKILA

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Set up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'  # Adjust Node.js version if needed

      # Step 3: Install dependencies with a specified working directory
      - name: Install dependencies
        run: npm install
        working-directory: ./SmartClassRoutineManagementSystem

      # Step 4: Run Mocha tests in the specified directory
      - name: Run Mocha tests
        run: npm test
        working-directory: ./SmartClassRoutineManagementSystem
