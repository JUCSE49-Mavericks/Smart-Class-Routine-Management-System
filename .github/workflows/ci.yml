name: Node.js CI

on:
  push:
    branches:
      - classRoutine_Sadia
  pull_request:
    branches:
      - classRoutine_Sadia

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.18.0'  # Use the required Node.js version

      - name: Install dependencies
        run: npm install
        working-directory: ./SmartClassRoutineManagementSystem

      # Install Mocha globally to avoid permission issues
      - name: Install Mocha globally
        run: npm install -g mocha
        working-directory: ./SmartClassRoutineManagementSystem

      - name: Run Mocha tests
        run: mocha --extension js,mjs 'tests/**/*.{js,mjs,cjs}'
        working-directory: ./SmartClassRoutineManagementSystem
