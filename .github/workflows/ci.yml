name: Backend CI for classRoutine_Sadia

on:
  push:
    branches:
      - classRoutine_Sadia
  pull_request:
    branches:
      - classRoutine_Sadia

jobs:
  backend-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [16.x]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies for backend
      working-directory: ./SmartClassRoutineManagementSystem
      run: npm install

    - name: Run Mocha tests
      working-directory: ./SmartClassRoutineManagementSystem
      run: npx mocha "test/**/*.js"
