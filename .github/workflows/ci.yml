name: Node.js CI

on:
  push:
    branches:
      - classRoutine_AKILA
  pull_request:
    branches:
      - classRoutine_AKILA

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Set CI environment variable to 'true'
      - name: Set CI environment variable
        run: echo "CI=true" >> $GITHUB_ENV

      # 3. Set up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      # 4. Install dependencies
      - name: Install dependencies
        run: npm install
        working-directory: ./SmartClassRoutineManagementSystem

      # 5. Run tests
      - name: Run Mocha tests
        run: npm test
        working-directory: ./SmartClassRoutineManagementSystem
