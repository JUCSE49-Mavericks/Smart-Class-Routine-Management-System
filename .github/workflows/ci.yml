name: Node.js CI

on:
  push:
    branches:
      - classRoutine_AKILA
  pull_request:
    branches:
      - classRoutine_AKILA

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'  # Use the version your project needs

      - name: Install dependencies
        run: npm install

      - name: Run Mocha tests
        run: npm test
