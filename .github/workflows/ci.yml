name: Node.js CI

# Run the workflow only on the classRoutine_AKILA branch
on:
  push:
    branches:
      - classRoutine_AKILA
  pull_request:
    branches:
      - classRoutine_AKILA

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Set up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'  # Specify the Node.js version you want to use

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm install

      # Step 4: Run lint (optional, if you have ESLint configured)
      - name: Run linter
        run: npm run lint
        # Ensure you have a linting script in your package.json file, like "lint": "eslint ."

      # Step 5: Run Mocha tests
      - name: Run Mocha tests
        run: npm test
