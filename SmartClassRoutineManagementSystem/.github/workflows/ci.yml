name: Run Tests

on:
  push:
    branches:
      - classRoutine_Trisha  # Trigger on push to the classRoutine_Trisha branch
  pull_request:
    branches:
      - classRoutine_Trisha  # Trigger on pull requests to the classRoutine_Trisha branch

jobs:
  test:
    runs-on: ubuntu-latest  # Runs the job on the latest Ubuntu environment
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3  # Checkout the code from the repository

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'  # You can specify a different version of Node.js if needed

    - name: Install dependencies
      run: |
        npm install  # Install project dependencies

    - name: Run tests
      run: |
        npm test  # Run the tests using Mocha

    
